<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; color: #333;">
<div style="max-width: 500px; margin: auto; padding: 20px; border: 1px solid #ddd; text-align: center; border-radius: 8px;">
    <h1>Gatch Team</h1>
    <h2>Verify your account</h2>
    <p>Hi <span th:text="${username}">User</span>,</p>
    <p>Enter the following 6-digit code in the app to activate your account. This code <b>will expire in 15 minutes</b>.</p>

    <div style="margin: 30px 0; font-size: 36px; font-weight: bold; letter-spacing: 8px; color: black;">
        <span th:text="${token}">123456</span>
    </div>

    <p style="font-size: 12px; color: #888;">If you didn't request this code, please ignore this email.</p>
</div>
</body>
</html>
