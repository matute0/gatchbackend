<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; color: #333;">
<div style="max-width: 500px; margin: auto; padding: 20px; border: 1px solid #ddd; text-align: center; border-radius: 8px;">
    <h1>Gatch Team</h1>
    <h2>Verify your account</h2>
    <p>Hi <span th:text="${username}">User</span>,</p>
    <p>Copy and paste the following activation code in the app to verify your account. This code <b>will expire in 15 minutes</b>.</p>

    <div style="margin: 30px auto; padding: 15px; max-width: 400px; background-color: #f4f4f4; border-radius: 6px; font-size: 18px; font-family: 'Courier New', Courier, monospace; font-weight: bold; color: black; word-break: break-all;">
        <span th:text="${code}">123e4567-e89b-12d3-a456-426614174000</span>
    </div>

    <p style="font-size: 12px; color: #888;">If you didn't request this code, please ignore this email.</p>
</div>
</body>
</html>
